name: TechNote 자동 발행 (매일)

# 매일 정해진 시각에 Microsoft 공식 블로그에서 주제를 알아서 골라 글을 쓰고
# 자동으로 커밋/푸시한다. 사람이 링크를 주는 수동 작업(Claude Cowork 등)과는
# 별개로 돌아가는, 완전 자동 파이프라인이다.
#
# 필요한 사전 설정 (저장소 Settings → Secrets and variables → Actions):
#   - Secrets  → ANTHROPIC_API_KEY : Anthropic 콘솔(console.anthropic.com/settings/keys)에서
#     발급한 API 키. 이 키로 이 워크플로가 매일 소비하는 비용은 Claude.ai 구독과는 별도로
#     Anthropic API 사용량에 청구된다.
#   - Variables(선택) → CLAUDE_MODEL : 비워두면 기본값(claude-sonnet-5) 사용.
#
# 시각을 바꾸려면 아래 cron을 수정하면 된다. cron은 UTC 기준이라 한국시간(KST, UTC+9)
# 오전 9시는 UTC 00:00 이다. 예: 한국시간 오전 6시로 바꾸려면 "0 21 * * *"(전날 UTC 21시).
on:
  schedule:
    - cron: "0 0 * * *"   # 매일 KST 오전 9시
  workflow_dispatch: {}    # Actions 탭에서 수동으로도 즉시 실행 가능(테스트용)

permissions:
  contents: write

concurrency:
  group: technote-auto-post
  cancel-in-progress: false

jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install --quiet anthropic feedparser requests beautifulsoup4

      - name: 자동 글쓰기 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python auto_post.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "TechNote Auto Poster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 오늘은 커밋하지 않음"
          else
            git commit -m "자동 발행: $(date -u +%Y-%m-%d) 일일 글 추가"
            git push
          fi
